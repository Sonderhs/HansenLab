<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#eae5e1" />
    <meta
      name="description"
      content="Hansen Lab — 记录技术、构建过程，以及值得留下的想法。个人三维档案馆概念演示。"
    />
    <title>Hansen Lab · 个人研究与实践档案</title>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%mark.svg" />
    <style>
      #bootstrap-placeholder {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #eae5e1;
        color: #242622;
        font:
          12px system-ui,
          sans-serif;
      }
      #bootstrap-placeholder b {
        font-size: 24px;
        letter-spacing: 5px;
      }
      #bootstrap-placeholder p {
        color: #74766c;
      }
      #bootstrap-placeholder noscript {
        margin: 24px;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <div id="bootstrap-placeholder" role="status">
        <img src="%BASE_URL%mark.svg" width="48" height="48" alt="" /><b
          >HANSEN LAB</b
        >
        <p>正在准备个人档案…</p>
        <noscript>请启用 JavaScript 以浏览三维档案与文章。</noscript>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
